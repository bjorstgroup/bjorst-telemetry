[package]
name = "bjorst-telemetry"
version = "0.1.0"
edition = "2021"
authors = ["Bjorst Engineering <engineering@bjorst.com>"]
license = "MIT"
description = "Tracing + OTLP telemetry bootstrap for Bjorst axum services (generic endpoint/headers, Axiom-compatible)"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# 0.33: opentelemetry_sdk <= 0.32.0 allocates without bound on W3C Baggage
# propagation (advisory). The batch exporter runs on its own thread since 0.28,
# so the OTLP client is the blocking one.
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
